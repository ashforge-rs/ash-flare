[package]
name = "ash-flare"
version = "3.0.1"
edition = "2024"
authors = ["Giorgos Ntemiris <ntemirisgiorgos3@gmail.com>"]
autoexamples = false
exclude = ["*.sh", "*.cast", "architecture.md"]
license = "Apache-2.0"
description = "Fault-tolerant supervision trees for Rust with distributed capabilities inspired by Erlang/OTP"
documentation = "https://docs.rs/ash-flare"
repository = "https://github.com/ashforge-rs/ash-flare"
readme = "README.md"
keywords = ["supervisor", "fault-tolerance", "resilience", "distributed"]
categories = ["asynchronous", "concurrency"]
rust-version = "1.88"

[lib]
name = "ash_flare"
# Only an rlib: maturin builds the Python extension's cdylib itself (it passes
# `--crate-type cdylib`), so ordinary `cargo build`s skip that extra link step.
crate-type = ["rlib"]

[features]
default = []
# Builds the Python extension module. Pure-Rust consumers should leave this off
# so pyo3 and its Python linkage are not compiled at all.
python = [
    "dep:pyo3",
    "dep:pythonize",
    "pyo3/extension-module",
]

[dependencies]
tokio = { version = "1.53", features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
thiserror = "2.0"
rkyv = { version = "0.8", features = ["alloc", "bytecheck"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "6.2"
tracing = "0.1"
# Authenticating remote supervisor connections (challenge-response).
hmac = "0.13"
sha2 = "0.11"
getrandom = "0.4"
pyo3 = { version = "0.29", features = ["abi3-py39"], optional = true }
pythonize = { version = "0.29", optional = true }

[profile.release]
# Whole-program optimisation for release builds, which is what maturin uses for
# the Python wheels. Costs build time, not runtime.
lto = "thin"
codegen-units = 1

[dev-dependencies]
# Tests, examples and doctests may use any tokio feature.
tokio = { version = "1.53", features = ["full"] }
rand = "0.10"
criterion = { version = "0.8", features = ["html_reports", "async_tokio"] }

[[bench]]
name = "supervision_benchmark"
harness = false

